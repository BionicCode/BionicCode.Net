name: Sync .editorconfig from canonical (PR-only)

on:
  push:
    branches-ignore:
      - "chore/sync-editorconfig" # bot PR branch
  pull_request:
  workflow_dispatch:
  # Optional polling safety net (recommended for dormant repos):
  # schedule:
  #   - cron: "17 * * * *"  # hourly at :17

permissions:
  contents: write
  pull-requests: write

env:
  CANONICAL_RAW_URL: https://raw.githubusercontent.com/BionicCode/bioniccode-code-style/refs/heads/main/BionicCode.CodeStyle/BionicCode.CodeStyle/.editorconfig
  SYNC_BRANCH: chore/sync-editorconfig

# Concurrency scoped per PR or per ref (prevents cross-branch cancellations)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-on-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Download canonical .editorconfig
        run: |
          set -euo pipefail
          curl -fsSL "${CANONICAL_RAW_URL}" -o canonical.editorconfig

      - name: Ensure exactly one tracked .editorconfig (strict)
        run: |
          set -euo pipefail
          count=$(git ls-files '**/.editorconfig' | wc -l | tr -d ' ')
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one tracked .editorconfig (repo root). Found: $count"
            git ls-files '**/.editorconfig' || true
            exit 1
          fi

      - name: Fail if branch .editorconfig is out of sync
        run: |
          set -euo pipefail
          if cmp -s .editorconfig canonical.editorconfig; then
            echo ".editorconfig is in sync with canonical."
          else
            echo "::error::.editorconfig is OUT OF SYNC with canonical. Merge the sync PR created by this workflow."
            exit 1
          fi

  open-or-update-sync-pr:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Determine base branch
        id: base
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
  
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.name }}
  
      - name: Download canonical .editorconfig
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/BionicCode/bioniccode-code-style/main/.editorconfig" \
            -o canonical.editorconfig
  
      - name: Apply if changed
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .editorconfig ] && cmp -s .editorconfig canonical.editorconfig; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            mv canonical.editorconfig .editorconfig
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  
      - name: Compute sync branch name (per-base)
        if: steps.diff.outputs.changed == 'true'
        id: syncbranch
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.base.outputs.name }}"
          safe="$(echo "$base" | tr '/ ' '--')"
          echo "name=chore/sync-editorconfig/$safe" >> "$GITHUB_OUTPUT"
  
      - name: Create or update PR into the base branch
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ steps.syncbranch.outputs.name }}
          base: ${{ steps.base.outputs.name }}
          title: "chore: sync .editorconfig from canonical"
          commit-message: "chore(sync): update .editorconfig from canonical"
          add-paths: |
            .editorconfig
