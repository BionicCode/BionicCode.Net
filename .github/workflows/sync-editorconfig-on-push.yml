name: Sync .editorconfig from canonical (PR-only)

on:
  # "Git-triggered polling": run on pushes in this repo
  push:
    branches:
      - "**"
    branches-ignore:
      - "chore/sync-editorconfig" # bot branch created by this workflow
  # Fail early on PRs if branch is out-of-sync
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CANONICAL_RAW_URL: https://raw.githubusercontent.com/BionicCode/bioniccode-code-style/main/.editorconfig
  SYNC_BRANCH: chore/sync-editorconfig

concurrency:
  group: editorconfig-sync
  cancel-in-progress: true

jobs:
  # 1) PR guard: make out-of-sync immediately visible to developers
  verify-on-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Download canonical .editorconfig
        run: |
          set -euo pipefail
          curl -fsSL "${CANONICAL_RAW_URL}" -o canonical.editorconfig

      - name: Ensure exactly one tracked .editorconfig (optional strictness)
        run: |
          set -euo pipefail
          count=$(git ls-files '**/.editorconfig' | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "::error::.editorconfig is missing in this repo."
            exit 1
          fi
          if [ "$count" -gt 1 ]; then
            echo "::error::Multiple .editorconfig files found. Keep only the repo-root .editorconfig to avoid overrides."
            git ls-files '**/.editorconfig'
            exit 1
          fi

      - name: Fail if branch .editorconfig is out of sync
        run: |
          set -euo pipefail
          if cmp -s .editorconfig canonical.editorconfig; then
            echo ".editorconfig is in sync with canonical."
          else
            echo "::error::.editorconfig is OUT OF SYNC with canonical. Merge the sync PR (or rerun the sync workflow)."
            exit 1
          fi

  # 2) PR creator/updater: always proposes canonical via one rolling PR
  open-or-update-sync-pr:
    if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download canonical .editorconfig
        run: |
          set -euo pipefail
          curl -fsSL "${CANONICAL_RAW_URL}" -o canonical.editorconfig

      - name: Detect changes
        id: diff
        run: |
          set -euo pipefail
          if [ -f .editorconfig ] && cmp -s .editorconfig canonical.editorconfig; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            mv canonical.editorconfig .editorconfig
          fi

      - name: Create or update PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ env.SYNC_BRANCH }}
          base: ${{ github.event.repository.default_branch }}
          title: "chore: sync .editorconfig from canonical"
          commit-message: "chore(sync): update .editorconfig from canonical"
          body: |
            Automated sync of `.editorconfig` from the canonical repository.

            Source: BionicCode/bioniccode-code-style (main)
          add-paths: |
            .editorconfig
          labels: automation
